<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1F33">
<title>SAMASSA TECHNOLOGIE — Services et produits informatiques à Kayes</title>
<meta name="description" content="Impression, photos d'identité, documents administratifs, dépannage informatique, sites web et matériel. Consultez nos services et commandez par WhatsApp.">
<meta property="og:type" content="website"><meta property="og:site_name" content="SAMASSA TECHNOLOGIE">
<meta property="og:title" content="SAMASSA TECHNOLOGIE — Tout pour l'informatique à Kayes">
<meta property="og:description" content="Impression, photos d'identité, documents administratifs, dépannage, sites web et matériel. Commandez par WhatsApp.">
<meta property="og:image" content="https://samassa-technologie-app-2.vercel.app/icon-512x512.png">
<link rel="icon" href="/icon-192x192.png">
<style>
:root{--nuit:#0B1F33;--bleu:#0877B9;--ciel:#1AA7E8;--vert:#128C4B;--vert2:#0E7A40;--fond:#F3F6FA;--carte:#fff;--txt:#0A1628;--gris:#5B6B7F;--bord:#E1E8F0}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fond);color:var(--txt);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}.w{max-width:1080px;margin:0 auto;padding:0 16px}
/* En-tête */
.hero{background:linear-gradient(135deg,var(--nuit) 0%,#0F3558 60%,#0A5C92 100%);color:#fff;padding:26px 0 30px}
.hero .w{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border-radius:16px;padding:8px 12px;flex:0 0 auto;box-shadow:0 6px 18px rgba(0,0,0,.25)}.logo img{display:block;height:64px}
.hd{flex:1 1 260px;min-width:0}.hd h1{margin:0;font-size:clamp(21px,4.6vw,30px);letter-spacing:.2px;line-height:1.15}
.hd .sl{color:#9AD7FA;font-weight:600;font-size:15px;margin-top:4px}.hd .ad{color:#C9D8E8;font-size:13.5px;margin-top:8px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;flex:1 1 100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;min-height:46px;border:0;cursor:pointer;font-family:inherit}
.btn.wa{background:#25D366;color:#063B1C}.btn.tel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}.btn.par{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.promo{background:#FFF4D6;border-bottom:1px solid #F2D58A;color:#6B4A00;font-weight:700;text-align:center;padding:10px 16px;font-size:14.5px}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:-16px auto 0;position:relative}
.info{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 14px rgba(10,22,40,.06);font-size:13.5px}
.info b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:700;margin-bottom:1px}.info i{font-style:normal;font-size:20px;line-height:1.2}
/* Recherche et catégories */
.outils{position:sticky;top:0;z-index:20;background:var(--fond);padding:14px 0 8px;margin-top:8px}
#q{width:100%;padding:13px 14px;border:1.5px solid var(--bord);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--txt)}#q:focus{outline:none;border-color:var(--bleu);box-shadow:0 0 0 3px rgba(8,119,185,.18)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;border:1.5px solid var(--bord);background:#fff;color:var(--txt);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:40px}
.cats button.on{background:var(--nuit);color:#fff;border-color:var(--nuit)}
@media(min-width:900px){.cats{flex-wrap:wrap;overflow:visible}}
/* Sections */
details.g{margin-top:14px}details.g>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:6px 2px 10px;border-bottom:2px solid var(--bord)}
details.g>summary::-webkit-details-marker{display:none}.ic{width:42px;height:42px;border-radius:12px;background:#E3F2FC;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
details.g>summary h2{margin:0;font-size:18px;flex:1;min-width:0}details.g>summary span{color:var(--gris);font-size:13px;font-weight:600;white-space:nowrap}
details.g>summary::after{content:"▾";color:var(--gris);font-size:16px}details.g[open]>summary::after{content:"▴"}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.it{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(10,22,40,.04)}
.it h3{margin:0;font-size:15.5px;line-height:1.3}.it p{margin:0;color:var(--gris);font-size:13.5px;flex:1}
.bas{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.pr{font-weight:800;color:var(--bleu);font-size:16px;white-space:nowrap}.pr.dem{color:var(--gris);font-weight:600;font-size:13px}
.cmd{background:var(--vert);color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}.cmd:hover{background:var(--vert2)}
.v{text-align:center;color:var(--gris);padding:36px 10px}
/* Pied */
footer{margin-top:34px;background:var(--nuit);color:#C9D8E8;padding:24px 0 96px;font-size:13.5px}footer b{color:#fff}footer .l{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}footer a{color:#9AD7FA}
.fx{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--bord);backdrop-filter:blur(6px)}
.fx a{display:flex;max-width:1048px;margin:0 auto;background:#25D366;color:#063B1C;text-decoration:none;border-radius:12px;padding:13px;font-weight:800;justify-content:center;gap:8px;min-height:48px;align-items:center}
@media(min-width:900px){.fx{display:none}footer{padding-bottom:28px}}
@media(max-width:520px){.logo img{height:52px}.btn{flex:1 1 auto}.infos{gap:0;background:#fff;border:1px solid var(--bord);border-radius:14px;box-shadow:0 4px 14px rgba(10,22,40,.06);overflow:hidden}.info{border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--bord);padding:10px 14px}.info:first-child{border-top:0}}
</style></head><body>
<div id="promo" class="promo" hidden></div>
<header class="hero"><div class="w">
  <div class="logo"><img src="/logo.png" alt="Logo SAMASSA TECHNOLOGIE"></div>
  <div class="hd"><h1 id="nom">SAMASSA TECHNOLOGIE</h1><div class="sl" id="slogan">Tout pour l'informatique</div><div class="ad" id="adr"></div></div>
  <div class="cta"><a class="btn wa" id="waH" href="#">💬 Commander sur WhatsApp</a><a class="btn tel" id="telH" href="#" hidden>📞 Appeler</a><button class="btn par" id="partager" type="button" hidden>🔗 Partager</button></div>
</div></header>
<main class="w">
  <div class="infos" id="infos"></div>
  <div id="app"><div class="v">Chargement du catalogue…</div></div>
</main>
<footer><div class="w"><div class="l"><div><b id="nomF">SAMASSA TECHNOLOGIE</b><br><span id="adrF"></span></div><div id="contactF"></div></div><div style="margin-top:14px;font-size:12px;opacity:.75" id="maj"></div></div></footer>
<div class="fx" id="fx" hidden><a id="wa" href="#">💬 Nous écrire sur WhatsApp</a></div>
<script src="/firebase-config.js"></script><script src="/catalogue.js?v=4"></script>
<script>
(function(){
  var app=document.getElementById('app'),h=(location.hash.match(/c=([^&]+)/)||[])[1],m=location.pathname.match(/^\/c\/([A-Za-z0-9]+)/);
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function tel(t){var n=String(t||'').replace(/\D/g,'');if(n.length>8&&n.indexOf('223')===0)n=n.slice(3);return n.length===8?n.replace(/(\d\d)(?=\d)/g,'$1 '):String(t||'')}
  var src;
  if(m&&typeof FIREBASE_CONFIG!=='undefined')src=Catalogue.charger(FIREBASE_CONFIG.databaseURL,m[1]);
  else if(h)src=Catalogue.decoder(h);
  else{app.innerHTML='<div class="v">Ce lien de catalogue est incomplet. Demandez-en un nouveau à SAMASSA TECHNOLOGIE.</div>';return}
  src.then(function(d){
    var s=d.s||{},nom=s.n||'SAMASSA TECHNOLOGIE',cat='Tout',q='',ouvert={};
    document.getElementById('nom').textContent=nom;document.getElementById('nomF').textContent=nom;document.title=nom+' — Services et produits';
    if(s.g!=null)document.getElementById('slogan').textContent=s.g;
    document.getElementById('adr').textContent=s.a?'📍 '+s.a:'';document.getElementById('adrF').textContent=s.a||'';
    if(s.p){var pr=document.getElementById('promo');pr.textContent='🎁 '+s.p;pr.hidden=false}
    var info=Catalogue.lienCommande(s.t,nom,'des informations').replace(/je souhaite commander : des informations\..*$/,'je voudrais des informations.');
    info='https://wa.me/'+Catalogue.numWa(s.t)+'?text='+encodeURIComponent('Bonjour '+nom+', je voudrais des informations.');
    document.getElementById('waH').href=info;document.getElementById('wa').href=info;document.getElementById('fx').hidden=false;
    var n8=String(s.t||'').replace(/\D/g,'').slice(-8);if(n8.length===8){var th=document.getElementById('telH');th.href='tel:+223'+n8;th.hidden=false}
    var par=document.getElementById('partager');if(navigator.share){par.hidden=false;par.onclick=function(){navigator.share({title:nom,text:nom+(s.g?' — '+s.g:''),url:location.href}).catch(function(){})}}
    var I=[];if(s.h)I.push(['🕘','Horaires',esc(s.h)]);if(s.t)I.push(['📞','Téléphone / WhatsApp',esc(tel(s.t))]);I.push(['💳','Paiement','Wave · Orange Money · Moov Money · Espèces']);
    document.getElementById('infos').innerHTML=I.map(function(x){return'<div class="info"><i>'+x[0]+'</i><div><b>'+x[1]+'</b>'+x[2]+'</div></div>'}).join('');
    document.getElementById('contactF').innerHTML=(s.t?'Tél / WhatsApp : <b>'+esc(tel(s.t))+'</b><br>':'')+(s.e?'E-mail : <a href="mailto:'+esc(s.e)+'">'+esc(s.e)+'</a>':'');
    if(d.maj){try{document.getElementById('maj').textContent='Catalogue mis à jour le '+new Date(d.maj).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'. Prix en francs CFA, donnés à titre indicatif.'}catch(e){}}
    var cats=['Tout'].concat(Array.from(new Set(d.i.map(function(x){return x[2]}))));
    function carte(x){var prix=Number(x[1])>0;return'<article class="it"><h3>'+esc(x[0])+'</h3>'+(x[3]?'<p>'+esc(x[3])+'</p>':'<p></p>')+'<div class="bas"><span class="pr'+(prix?'':' dem')+'">'+(prix?Number(x[1]).toLocaleString('fr-FR')+' F CFA':'Prix sur demande')+'</span><a class="cmd" href="'+Catalogue.lienCommande(s.t,nom,x[0],x[1])+'">'+(prix?'Commander':'Demander le prix')+'</a></div></article>'}
    function draw(){
      var l=d.i.filter(function(x){return(cat==='Tout'||x[2]===cat)&&(x[0]+' '+(x[3]||'')).toLowerCase().indexOf(q)>-1}),corps;
      if(!l.length)corps='<div class="v">Aucun résultat. Écrivez-nous sur WhatsApp : nous faisons peut-être ce que vous cherchez.</div>';
      else corps=cats.slice(1).filter(function(c){return l.some(function(x){return x[2]===c})}).map(function(c,i){var it=l.filter(function(x){return x[2]===c}),o=q||cat!=='Tout'?true:(ouvert[c]===undefined?true:ouvert[c]);return'<details class="g"'+(o?' open':'')+' data-g="'+esc(c)+'"><summary><div class="ic">'+Catalogue.icone(c)+'</div><h2>'+esc(c)+'</h2><span>'+it.length+' offre'+(it.length>1?'s':'')+'</span></summary><div class="grille">'+it.map(carte).join('')+'</div></details>'}).join('');
      app.innerHTML='<div class="outils"><input id="q" type="search" placeholder="Rechercher un service ou un produit…" aria-label="Rechercher" value="'+esc(q)+'"><div class="cats" role="tablist">'+cats.map(function(c){return'<button type="button" class="'+(c===cat?'on':'')+'" data-c="'+esc(c)+'">'+(c==='Tout'?'':Catalogue.icone(c)+' ')+esc(c)+'</button>'}).join('')+'</div></div>'+corps;
      var i=document.getElementById('q');i.oninput=function(){q=i.value.toLowerCase();var p=i.selectionStart;draw();var n=document.getElementById('q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
      app.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){cat=b.dataset.c;draw()}});
      app.querySelectorAll('details.g').forEach(function(e){e.ontoggle=function(){if(!q&&cat==='Tout')ouvert[e.dataset.g]=e.open}});
    }
    draw();
  }).catch(function(){app.innerHTML='<div class="v">Impossible de lire ce catalogue. Demandez un nouveau lien à SAMASSA TECHNOLOGIE.</div>'});
})();
</script></body></html>
