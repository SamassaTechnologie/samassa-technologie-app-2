<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1B2A">
<title>Catalogue — SAMASSA TECHNOLOGIE</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F1F5F9;color:#0A1628}.w{max-width:640px;margin:0 auto;padding:16px 14px 90px}
.h{text-align:center;margin-bottom:12px}.h img{height:56px}.h b{display:block;margin-top:6px;font-size:17px}.h span{font-size:12px;color:#64748B}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #CBD5E1;border-radius:10px;font-size:15px;margin-bottom:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.cats button{white-space:nowrap;border:1px solid #CBD5E1;background:#fff;border-radius:99px;padding:7px 13px;font-size:13px}.cats button.on{background:#0877B9;color:#fff;border-color:#0877B9}
.it{background:#fff;border-radius:12px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(10,22,40,.06)}.it b{font-size:14px}.it small{display:block;color:#64748B;margin-top:2px}.pr{font-weight:800;color:#0877B9;white-space:nowrap}
.cmd{display:inline-block;margin-top:6px;background:#16A34A;color:#fff;text-decoration:none;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.fx{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:#fff;border-top:1px solid #E2E8F0;text-align:center}.fx a{display:block;max-width:612px;margin:0 auto;background:#16A34A;color:#fff;text-decoration:none;border-radius:12px;padding:13px;font-weight:800}
.v{text-align:center;color:#64748B;padding:30px 10px}
</style></head><body><div class="w">
<div class="h"><img src="logo.png" alt="Logo"><b id="nom">SAMASSA TECHNOLOGIE</b><span id="adr"></span></div>
<div id="app"><div class="v">Chargement du catalogue…</div></div></div>
<div class="fx" id="fx" style="display:none"><a id="wa" href="#">💬 Nous écrire sur WhatsApp</a></div>
<script src="catalogue.js?v=2"></script>
<script>
(function(){
  var app=document.getElementById('app'),h=(location.hash.match(/c=([^&]+)/)||[])[1];
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  if(!h){app.innerHTML='<div class="v">Ce lien de catalogue est incomplet. Demandez-en un nouveau à SAMASSA TECHNOLOGIE.</div>';return}
  Catalogue.decoder(h).then(function(d){
    var s=d.s||{},cat='Tout',q='';document.getElementById('nom').textContent=s.n||'SAMASSA TECHNOLOGIE';document.getElementById('adr').textContent=s.a||'';document.title='Catalogue — '+(s.n||'SAMASSA TECHNOLOGIE');
    var fx=document.getElementById('fx');fx.style.display='block';document.getElementById('wa').href=Catalogue.lienCommande(s.t,s.n,'des informations').replace('je souhaite commander : des informations. Pouvez-vous me donner le prix et la disponibilité ?','je voudrais des informations.');
    var cats=['Tout'].concat(Array.from(new Set(d.i.map(function(x){return x[2]}))));
    function draw(){
      var l=d.i.filter(function(x){return(cat==='Tout'||x[2]===cat)&&x[0].toLowerCase().indexOf(q)>-1});
      app.innerHTML='<input id="q" placeholder="🔎 Rechercher un produit ou un service" value="'+esc(q)+'"><div class="cats">'+cats.map(function(c){return'<button class="'+(c===cat?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</div>'+
        (l.length?l.map(function(x){return'<div class="it"><div><b>'+esc(x[0])+'</b><small>'+esc(x[2])+'</small></div><div style="text-align:right"><div class="pr">'+(Number(x[1])>0?Number(x[1]).toLocaleString('fr-FR')+' F':'Sur devis')+'</div><a class="cmd" href="'+Catalogue.lienCommande(s.t,s.n,x[0],x[1])+'">Commander</a></div></div>'}).join(''):'<div class="v">Aucun résultat.</div>');
      var i=document.getElementById('q');i.oninput=function(){q=i.value.toLowerCase();var p=i.selectionStart;draw();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
      app.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){cat=b.dataset.c;draw()}});
    }
    draw();
  }).catch(function(){app.innerHTML='<div class="v">Impossible de lire ce catalogue. Demandez un nouveau lien à SAMASSA TECHNOLOGIE.</div>'});
})();
</script></body></html>
