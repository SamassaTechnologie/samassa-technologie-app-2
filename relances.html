<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1B2A">
<title>Relances & rappels — SAMASSA TECHNOLOGIE</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#F1F5F9}.wrap{max-width:900px;margin:72px auto 60px;padding:0 14px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#64748B;font-size:13px;margin-bottom:14px}
#rl-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:12px}.k b{display:block;font-size:18px}.k span{font-size:11px;color:#64748B}.k.r b{color:#DC2626}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid #CBD5E1;background:#fff;border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}.chips button.on{background:#0877B9;color:#fff;border-color:#0877B9}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid #EEF2F7}.row:first-child{border-top:0}
.m{font-size:12px;color:#64748B;margin-top:2px}.p{font-size:10px;border-radius:99px;padding:2px 8px;background:#E2E8F0;margin-left:4px}.p.r{background:#FEE2E2;color:#B91C1C}.p.a{background:#FEF3C7;color:#B45309}.p.g{background:#DCFCE7;color:#15803D}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.act input{width:100px;padding:8px;border:1px solid #CBD5E1;border-radius:8px}
.b{border:0;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}.b.wa{background:#16A34A}.b.ok{background:#0877B9}
.vide{color:#64748B;font-size:13px;padding:8px 0}
</style>
<link rel="stylesheet" href="theme-dark-pages.css?v=2">
<script src="theme.js?v=2"></script>
</head>
<body>
<div class="topbar"><a href="index.html" class="back-link">← Retour</a><span class="topbar-title">🔔 Relances & rappels</span><img src="logo.png" class="topbar-logo" alt="Logo"></div>
<div class="wrap" id="rl-app">
<h1>Relances & rappels</h1><div class="sub">Qui vous doit de l'argent, qui relancer aujourd'hui, ce qui manque en stock. L'encaissement est ajouté automatiquement à la caisse.</div>
<div id="rl-kpi"></div>
<div class="card"><h2>💰 Créances clients</h2>
<div class="chips"><button data-f="toutes" class="on">Toutes</button><button data-f="retard">En retard</button><button data-f="proche">Bientôt dues</button><button data-f="ok">Dans les délais</button><button data-f="sans">Sans échéance</button></div>
<div id="rl-liste"></div></div>
<div class="card"><h2>📜 Contrats impayés</h2><div id="rl-contrats"></div></div>
<div class="card"><h2>📦 Stock bas</h2><div id="rl-stock"></div></div>
</div>
<script src="esc.js"></script><script src="auth.js?v=roles1"></script><script src="firebase-config.js?v=sync4"></script><script src="sync.js?v=5"></script><script src="contrats.js?v=1"></script><script src="relances.js?v=1"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script>
<script src="app-moderne.js?v=1" defer></script>
</body>
</html>
