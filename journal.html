<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal d'activité — SAMASSA TECHNOLOGIE</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><style>body{font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:72px auto 60px;padding:0 18px}.hero{background:linear-gradient(135deg,#0A1628,#334155,#64748B);border-radius:16px;padding:22px 26px;color:#fff;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:20px}.hero p{margin:0;color:#CBD5E1;font-size:12px}.card{background:#fff;border:1px solid #E2ECF5;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(10,22,40,.06)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:9px 11px;border:1px solid #D8E4EF;border-radius:8px;font:inherit;font-size:12px}.toolbar input{flex:1;min-width:180px}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer;background:#EEF2FF;color:#3730A3}.row{display:grid;grid-template-columns:150px 1fr 1fr 130px 100px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #F0F4F8;font-size:11px}.row.head{font-weight:800;color:#7A94AF;text-transform:uppercase;font-size:10px}.time{color:#64748B}.action{font-weight:800;color:#0A1628}.user{color:#3730A3;overflow:hidden;text-overflow:ellipsis}.key{color:#64748B}.empty{text-align:center;padding:35px;color:#7A94AF;font-size:13px}@media(max-width:750px){.row{grid-template-columns:1fr 1fr}.row.head{display:none}.row>div:before{content:attr(data-label);display:block;font-size:9px;color:#94A3B8;text-transform:uppercase;margin-bottom:3px}}</style></head><body><div class="topbar"><a href="index.html" class="back-link">← Retour</a><span class="topbar-title">🧾 Journal d'activité</span><img src="logo.png" class="topbar-logo" alt="Logo"></div><main class="wrap"><div class="hero"><h1>🧾 Journal d'activité</h1><p>Traçabilité des enregistrements, modifications, suppressions et clôtures de caisse.</p></div><div class="card"><div class="toolbar"><input id="search" placeholder="🔍 Rechercher par utilisateur ou opération" oninput="render()"><select id="period" onchange="render()"><option value="7">7 derniers jours</option><option value="30">30 derniers jours</option><option value="0">Tout l'historique</option></select><button class="btn" onclick="exportLog()">⬇ Exporter CSV</button><button class="btn" onclick="clearLog()">🗑 Nettoyer</button></div><div class="row head"><div>Date</div><div>Opération</div><div>Clé / module</div><div>Utilisateur</div><div>Rôle</div></div><div id="log"></div></div></main><script src="auth.js?v=roles1"></script><script src="firebase-config.js?v=sync4"></script><script src="sync.js?v=5"></script><script>
const moduleNames={samassa_mouvements:'Caisse',samassa_clotures:'Clôture de caisse',samassa_stock_v2:'Stock',samassa_stock_mouvements:'Mouvements stock',samassa_clients:'Clients',samassa_audit_log:'Journal',samassa_recus:'Reçus',samassa_factures:'Factures',samassa_docs_admin:'Documents administratifs'};
function logs(){try{return JSON.parse(localStorage.getItem('samassa_audit_log')||'[]')}catch{return[]}}
function render(){let list=logs().slice().reverse(),days=Number(document.getElementById('period').value),q=document.getElementById('search').value.toLowerCase();if(days)list=list.filter(x=>Date.now()-new Date(x.timestamp).getTime()<days*86400000);if(q)list=list.filter(x=>(x.user+' '+x.action+' '+x.key+' '+x.role).toLowerCase().includes(q));const el=document.getElementById('log');if(!list.length){el.innerHTML='<div class="empty">Aucune activité enregistrée pour cette période.</div>';return}el.innerHTML=list.map(x=>`<div class="row"><div class="time" data-label="Date">${new Date(x.timestamp).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</div><div class="action" data-label="Opération">${x.action}</div><div class="key" data-label="Module">${moduleNames[x.key]||x.key}<br><small>${x.page||''}</small></div><div class="user" data-label="Utilisateur">${x.user||'—'}</div><div data-label="Rôle">${x.role||'—'}</div></div>`).join('')}
function exportLog(){const rows=[['Date','Opération','Module','Page','Utilisateur','Rôle'],...logs().map(x=>[x.timestamp,x.action,moduleNames[x.key]||x.key,x.page||'',x.user||'',x.role||''])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='journal-samassa-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
function clearLog(){if(Auth.role!=='administrateur')return alert('Action réservée à l’administrateur.');if(confirm('Supprimer le journal local ?')){localStorage.removeItem('samassa_audit_log');render()}}
window.addEventListener('load',()=>setTimeout(render,800));
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
