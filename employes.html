<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1B2A">
<title>Employés & paie — SAMASSA TECHNOLOGIE</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#F1F5F9}.wrap{max-width:900px;margin:72px auto 60px;padding:0 14px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#64748B;font-size:13px;margin-bottom:14px}
#em-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:12px}.k b{display:block;font-size:16px}.k span{font-size:11px;color:#64748B}.k.r b{color:#DC2626}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.g{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#475569;margin:6px 0 3px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #CBD5E1;border-radius:8px;font-size:14px}
.pj{border:1px solid #E2E8F0;border-radius:12px;padding:12px;margin-top:10px;background:#fff}.top{display:flex;justify-content:space-between;gap:8px}
.m{font-size:12px;color:#64748B;margin-top:3px}.p{font-size:10px;border-radius:99px;padding:2px 8px;background:#E2E8F0;margin-left:4px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.b{border:0;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}.b.wa{background:#16A34A}.b.ok{background:#0877B9}.b.g2{background:#E2E8F0;color:#334155}
.pri{background:#0877B9;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;margin-top:10px;cursor:pointer}.vide{color:#64748B;font-size:13px}
#em-cert{display:none}@media print{body.imp-cert>*:not(#em-cert){display:none!important}body.imp-cert #em-cert{display:block;padding:24px;background:#fff;color:#000}}
</style>
<link rel="stylesheet" href="theme-dark-pages.css?v=2">
<script src="theme.js?v=2"></script>
</head>
<body>
<div class="topbar"><a href="index.html" class="back-link">← Retour</a><span class="topbar-title">👷 Employés & paie</span><img src="logo.png" class="topbar-logo" alt="Logo"></div>
<div class="wrap" id="em-app">
<h1>Employés & paie</h1><div class="sub">Salaires, absences, primes et avances. Les avances et paiements sortent automatiquement de la caisse. Absence : salaire ÷ 26 jours par jour.</div>
<div class="card"><label for="em-mois">Mois</label><input type="month" id="em-mois"></div>
<div id="em-kpi"></div>
<div class="card"><h2>➕ Nouvel employé</h2><div class="g"><div><label for="em-nom">Nom *</label><input id="em-nom"></div><div><label for="em-poste">Poste</label><input id="em-poste"></div><div><label for="em-tel">Téléphone</label><input id="em-tel" inputmode="tel"></div><div><label for="em-sal">Salaire mensuel (FCFA) *</label><input type="number" id="em-sal" inputmode="numeric"></div></div><button class="pri" id="em-ok">Ajouter</button></div>
<div class="card"><h2>📋 Paie du mois</h2><div id="em-liste"></div></div>
</div>
<div id="em-cert"></div>
<script src="esc.js"></script><script src="auth.js?v=roles1"></script><script src="firebase-config.js?v=sync4"></script><script src="sync.js?v=5"></script><script src="employes.js?v=1"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script>
<script src="app-moderne.js?v=1" defer></script>
</body>
</html>
